<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<meta name="color-scheme" content="dark">
<title>Gửi em – Lời nhắn đặc biệt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;500;700&family=Dancing+Script:wght@500;700&display=swap">
<style>
:root{--pink:#ff7eb6;--pink2:#ffc2dc;--hot:#ff4f9a;--paper:#fff4f8;--ink:#6b2d4a;--bg:#07060a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:#fff;font-family:"Be Vietnam Pro",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#nightSky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#050508}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);
  z-index:10;max-width:88vw;padding:10px 15px;border:1px solid #ffffff22;border-radius:999px;
  background:#171720;color:#fff;font-size:.82rem;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.scene{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;opacity:0;transition:opacity .8s;pointer-events:none;z-index:2}
.scene.on{opacity:1;pointer-events:auto}
h1{font-family:"Dancing Script",cursive;font-size:clamp(2.2rem,9vw,3.4rem);color:var(--pink2);
  text-shadow:0 0 18px #ff4f9a88;line-height:1.2}
.sub{font-size:.95rem;opacity:.75;margin-top:12px;letter-spacing:.5px}
.tapHint{margin-top:34px;font-size:.92rem;color:#ffd6e8;animation:pulse 1.8s ease-in-out infinite}
.caption{position:absolute;bottom:90px;left:0;right:0;font-family:"Dancing Script",cursive;font-size:1.7rem;
  color:#ffd6e8;min-height:2em;padding:0 24px;opacity:0;transform:translateY(8px);
  transition:opacity .7s,transform .7s;pointer-events:none}
.caption.show{opacity:1;transform:none}
.hint-tap{position:absolute;bottom:18px;left:0;right:0;font-size:.9rem;color:#ffd6e8;
  animation:pulse 1.8s ease-in-out infinite;transition:opacity .5s;padding:0 16px}
.hint-tap.gone{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.35}}
.bq{position:relative;width:min(78vw,340px,calc((100vh - 210px)*.852));width:min(78vw,340px,calc((100dvh - 210px)*.852));aspect-ratio:1500/1760;
  touch-action:none;transform:scale(1);transform-origin:center;
  transition:transform .3s ease-out,opacity .6s;will-change:transform}
.bq::before{content:"";position:absolute;inset:-14%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,#ff4f9a30,transparent)}
.bq.holding{transform:scale(1.2);transition:transform .7s cubic-bezier(.25,.6,.4,1)}
.bq.leaving{transform:scale(1.7);opacity:0;transition:transform .7s ease-in,opacity .6s ease-in}
.bq>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.butterfly{position:absolute;z-index:4;pointer-events:none;font-size:clamp(12px,3.6vw,18px);opacity:.88;
  animation:butterflyDrift 4.5s ease-in-out infinite}
@keyframes butterflyDrift{0%,100%{transform:translate(0,0) rotate(-12deg)}50%{transform:translate(5px,-9px) rotate(12deg)}}
@media(max-height:650px){.bq{width:min(68vw,calc((100vh - 175px)*.852),300px);width:min(68vw,calc((100dvh - 175px)*.852),300px)}.caption{bottom:70px;font-size:1.4rem}.hint-tap{font-size:.8rem;bottom:10px}}
.flower{position:absolute;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.bloom{position:absolute;background:center/contain no-repeat;
  transform:translate(-50%,-50%) scale(.12) rotate(-15deg);opacity:0;pointer-events:none;z-index:3;
  transition:transform .85s cubic-bezier(.34,1.56,.64,1),opacity .45s}
.bloom.on{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
.bloom.ph{background:radial-gradient(circle,#ff8fab,#ff4f9a)}
.bloom.ph::after{content:"♥";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem}
#float{touch-action:none;overflow:hidden;padding:0;background:radial-gradient(ellipse at 50% 50%,#2a0a1e 0,#0c0510 55%,#050508 100%)}
#warp{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.fhint{padding:0 16px;position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:.85rem;color:#ffd6e8;opacity:0;pointer-events:none;transition:opacity 1s}
#envelope{background:radial-gradient(ellipse at 50% 45%,#3b1446 0,#12081a 60%,#07060a 100%)}
.envmove{transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .7s}
.envmove.leave{transform:translateY(22%) scale(.85);opacity:0}
.envwrap{position:relative;width:min(86vw,380px);aspect-ratio:31/20;perspective:1000px;cursor:pointer;outline:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.envwrap>*{position:absolute}
.e-back{left:0;top:0;width:100%;height:100%;background:#f1b9d0;border-radius:6px;box-shadow:0 18px 50px #000b,0 0 60px #ff4f9a33}
.e-card{left:5%;top:6%;width:90%;height:88%;background:#fff7fa;border-radius:5px;z-index:2;transition:transform 1s .55s cubic-bezier(.3,.8,.2,1)}
.open .e-card{transform:translateY(-58%)}
.e-pocket{left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:hidden;border-radius:6px}
.e-pocket i{position:absolute;left:0;top:0;width:100%;height:100%}
.p1{clip-path:polygon(0 0,50% 56%,0 100%);background:#f8cfe0}
.p2{clip-path:polygon(100% 0,50% 56%,100% 100%);background:#f5c4d9}
.p3{clip-path:polygon(0 100%,50% 56%,100% 100%);background:#fcdeea}
.e-pocket svg{position:absolute;bottom:0;width:36%}
.e-flap{left:0;top:0;width:100%;height:56%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.5,0,.3,1),z-index 0s .45s}
.open .e-flap{transform:rotateX(180deg);z-index:1}
.f-front,.f-back{position:absolute;left:0;top:0;width:100%;height:100%;clip-path:polygon(0 0,100% 0,50% 100%);
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f-front{background:linear-gradient(#ffe1ec,#f9c9dc)}
.f-back{background:#e9a6c2;transform:rotateX(180deg)}
.e-date{position:absolute;left:0;top:12%;width:100%;text-align:center;color:#d6457f;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.e-date small{display:block;font-size:.68rem;letter-spacing:2px;opacity:.85}
.e-date b{font:700 clamp(1.4rem,7vw,1.9rem) "Dancing Script",cursive}
.e-seal{position:absolute;left:50%;top:100%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6b7d,#c4162f 60%,#8f0e22);box-shadow:0 3px 8px #0006;
  display:flex;align-items:center;justify-content:center;color:#ffc2cb;font-size:clamp(14px,4.5vw,20px);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.1)}}
.e-hint{left:0;width:100%;top:112%;text-align:center;font-size:.85rem;color:#ffd6e8;animation:pulse 1.8s ease-in-out infinite;transition:opacity .4s}
.open .e-hint{opacity:0}
.letter{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:3;
  background:radial-gradient(ellipse at 50% 45%,#3b1446 0,#12081a 60%,#07060a 100%);
  opacity:0;pointer-events:none;transition:opacity .8s}
.letter.on{opacity:1;pointer-events:auto}
.sheet{position:relative;display:flex;width:min(100%,430px);max-height:100%;min-height:min(70%,560px);overflow:hidden;
  background:linear-gradient(160deg,#fffafc,#ffe9f1);border-radius:10px;box-shadow:0 18px 60px #000c,0 0 70px #ff4f9a30;
  transform:translateY(10%) scale(.8);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.letter.on .sheet{transform:none}
.fl{position:absolute;width:44%;pointer-events:none;z-index:0}
.fl.tl{top:0;left:0;transform:scaleY(-1)}
.fl.br{bottom:0;right:0;transform:scaleX(-1)}
.lph{position:absolute;right:7%;bottom:6%;width:21%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;z-index:2;
  background:center/cover #f7b8d0;box-shadow:0 4px 14px #c2417e55;display:none}
.lph.has{display:block}
.scroll{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;padding:46px 26px 110px;color:#a8316a;text-align:left}
.lt{font-family:"Dancing Script",cursive;font-weight:700;font-size:2rem;line-height:1.2;color:#e0488b;margin-bottom:14px;min-height:1.2em}
.scroll p{font-family:"Dancing Script",cursive;font-weight:500;font-size:1.2rem;line-height:1.65;min-height:1.2em;white-space:pre-wrap;margin-bottom:6px}
.sign{font-family:"Dancing Script",cursive;font-weight:700;font-size:1.6rem;color:#e0488b;text-align:right;margin-top:10px;min-height:1.6em}
.replay{margin-top:18px;background:none;border:1px solid #e0488b;color:#e0488b;padding:8px 18px;border-radius:30px;cursor:pointer;font:500 .85rem "Be Vietnam Pro",sans-serif}
@media(max-width:400px){.caption{font-size:1.45rem;padding:0 16px}.sub{font-size:.88rem}.scroll{padding:40px 20px 100px}.lt{font-size:1.75rem}.scroll p{font-size:1.12rem}}
@media(prefers-reduced-motion:reduce){.butterfly{animation:none}}

/* Nút mở thư trên màn chữ xoay */
.openBtn{position:absolute;left:50%;bottom:calc(max(28px,env(safe-area-inset-bottom,0px)) + 10px);z-index:6;
  transform:translate(-50%,16px);min-height:48px;padding:13px 30px;border:0;border-radius:999px;cursor:pointer;
  color:#fff;font:600 1rem "Be Vietnam Pro",sans-serif;white-space:nowrap;
  background:linear-gradient(135deg,#ff7eb6,#ff4f9a);box-shadow:0 8px 26px #ff4f9a77;
  opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
.openBtn.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);animation:btnBreath 2.2s ease-in-out infinite}
.openBtn:focus-visible{outline:2px solid #ffc2dc;outline-offset:3px}
@keyframes btnBreath{50%{transform:translate(-50%,-3px) scale(1.04)}}
/* Tối ưu điện thoại */
.fhint{bottom:calc(92px + env(safe-area-inset-bottom,0px));font-size:.8rem}
@media(max-width:400px){.openBtn{font-size:.95rem;padding:12px 24px}}
@media(max-height:560px){.openBtn{bottom:12px}.fhint{bottom:64px}}

/* Nút bật tắt nhạc */
.musicBtn{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:12px;z-index:9;width:40px;height:40px;
  border-radius:50%;border:1px solid rgba(255,170,210,.5);background:rgba(40,16,42,.72);color:#ffd6e8;
  font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
.musicBtn.show{opacity:1;pointer-events:auto}
.musicBtn.off{opacity:.5;text-decoration:line-through}
</style>
</head>
<body>
<canvas id="nightSky" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const CFG = {
  bouquetImage: "hoa.png", photos: [], flyPhotos: [], flyCount: 3,
  bouquetCaption: "Một bó hoa dành cho em", hint: "Nhấn giữ bó hoa để xem tiếp", holdMs: 700, btnDelay: 4000, music: "nhac.mp3", openLabel: "Mở thư 💌", flySeconds: 16,
  intro: { title: "Gửi em", sub: "Có một điều anh muốn nói với em…", button: "Chạm vào màn hình bất kỳ để bắt đầu" },
  messages: ["Yêu em", "Cho anh xin 500k", "Cho xin 500k", "Em là điều đẹp nhất",   "Luôn mỉm cười nhé",  "Chúc em luôn hạnh phúc", "Iu em nhiều", "Mãi yêu em", "20/10 vui vẻ"],
  date: "20/10", envLabel: "Dành tặng em", envHint: "Chạm phong bì để mở thư", letterPhoto: "", letterTitle: "Gửi cô gái của anh,",
  letter: ["Anh không giỏi nói những lời hoa mỹ, nên hôm nay anh chỉ muốn nói một điều thật lòng.", "Cảm ơn em vì đã ở đây, vì đã kiên nhẫn với anh, và vì đã làm cho những ngày bình thường trở nên đáng nhớ.", "Dù có xa cách, anh vẫn luôn mong em được vui và bình yên."], sign: "— Anh iu của mái"
};
const IMG_W = 1500, IMG_H = 1760;
const FLOWERS = [[736,170,170],[400,280,144],[1050,300,144],[710,480,136],[1180,500,170],[330,640,156],[580,770,160],[910,660,176]];
</script>

<section class="scene on" id="intro"><h1 id="introTitle"></h1><p class="sub" id="introSub"></p><p class="tapHint" id="tapHint"></p></section>
<section class="scene" id="bouquet"><div class="bq" id="bq"><img id="bqImg" alt="Bó hoa" draggable="false" decoding="async"></div><div class="hint-tap" id="hint"></div><div class="caption" id="cap"></div></section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="pg" cx=".5" cy=".75" r=".8"><stop offset="0" stop-color="#ffe3ee"/><stop offset="1" stop-color="#f27fae"/></radialGradient><g id="bl"><g fill="url(#pg)"><ellipse cx="0" cy="-17" rx="12" ry="18"/><ellipse cx="0" cy="-17" rx="12" ry="18" transform="rotate(72)"/><ellipse cx="0" cy="-17" rx="12" ry="18" transform="rotate(144)"/><ellipse cx="0" cy="-17" rx="12" ry="18" transform="rotate(216)"/><ellipse cx="0" cy="-17" rx="12" ry="18" transform="rotate(288)"/></g><circle r="6" fill="#ffd36e"/></g><g id="cl"><g fill="#9fd2b0"><ellipse cx="78" cy="112" rx="9" ry="28" transform="rotate(55 78 112)"/><ellipse cx="40" cy="92" rx="8" ry="24" transform="rotate(-20 40 92)"/><ellipse cx="120" cy="150" rx="8" ry="24" transform="rotate(95 120 150)"/></g><use href="#bl" transform="translate(48 150) scale(1.5)"/><use href="#bl" transform="translate(104 176) scale(1.05)"/><use href="#bl" transform="translate(26 96) scale(.9)"/><circle cx="88" cy="126" r="5" fill="#f7a8c6"/><circle cx="150" cy="184" r="4" fill="#f7a8c6"/></g></defs></svg>
<section class="scene" id="float"><canvas id="warp"></canvas><div class="fhint" id="fhint"></div><button class="openBtn" id="openBtn" type="button"></button></section>
<section class="letter" id="letter"><div class="sheet"><svg class="fl tl" viewBox="0 0 200 200"><use href="#cl"/></svg><svg class="fl br" viewBox="0 0 200 200"><use href="#cl"/></svg><div class="lph" id="lPhoto"></div><div class="scroll" id="lScroll"><div class="lt" id="lTitle"></div><div id="lBody"></div><div class="sign" id="lSign"></div><div style="text-align:center"><button class="replay" id="replay">Xem lại từ đầu</button></div></div></div></section>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let session = 0, timers = [];
let bloomedSet = new Set(), finishing = false, started = false, introReadyAt = 0;
let photoEls = [];
let skyPaused = false;
const alive = s => s === session;

const MAX_FLOWER = 480, MAX_FLY = 420;
const EXTS = ['jpg', 'jpeg', 'png', 'webp'];
function shrink(src, max) {
  return new Promise(res => {
    const im = new Image(); im.decoding = 'async';
    im.onload = () => {
      try {
        const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        if (sc >= 1) return res(src);
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const png = /\.png$/i.test(src); c.toBlob(b => res(b ? URL.createObjectURL(b) : src), png ? 'image/png' : 'image/jpeg', .85);
      } catch (e) { res(src); }
    };
    im.onerror = () => res(null); im.src = src;
  });
}
async function firstOf(names, max) { for (const n of names) { const u = await shrink(encodeURI(n), max); if (u) return u; } return null; }
const flowerP = FLOWERS.map((_, i) => CFG.photos[i] ? shrink(CFG.photos[i], MAX_FLOWER) : firstOf([`${i+1}.jpg`, `${i+1}.png`, `${i+1}.jpeg`, `${i+1}.webp`, `anh${i+1}.jpg`, `anh${i+1}.png`], MAX_FLOWER));
const flyP = Promise.all(CFG.flyPhotos.length ? CFG.flyPhotos.map(p => shrink(p, MAX_FLY)) : Array.from({ length: CFG.flyCount }, (_, k) => { const n = k + 1, names = []; for (const pre of ['bay']) for (const e of EXTS) names.push(`${pre}${n}.${e}`); return firstOf(names, MAX_FLY); })).then(a => a.filter(Boolean));

function show(id) { document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id)); }
function type(el, text, speed, s) {
  return new Promise(res => {
    const chars = Array.from(text); el.textContent = ''; let i = 0;
    const t = setInterval(() => { if (!alive(s)) { clearInterval(t); return res(); } el.textContent += chars[i++]; if (i >= chars.length) { clearInterval(t); res(); } }, speed);
    timers.push(t);
  });
}
let toastTimer = null;
function showToast(message) { const el = $('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1700); }

function buildBouquet() {
  const bq = $('bq'); bq.querySelectorAll('.flower,.bloom,.butterfly').forEach(n => n.remove()); bq.classList.remove('holding', 'leaving'); bloomedSet = new Set(); photoEls = [];
  FLOWERS.forEach(([x, y, r], i) => {
    const photo = document.createElement('div'); photo.className = 'bloom ph';
    photo.style.cssText = `left:${x / IMG_W * 100}%;top:${y / IMG_H * 100}%;width:${2 * r / IMG_W * 100}%;height:${2 * r / IMG_W * 100}%`;
    flowerP[i].then(u => { if (!u) return; photo.style.backgroundImage = `url('${u}')`; photo.classList.remove('ph'); });
    bq.appendChild(photo); photoEls.push(photo);
  });
  [[8,15,0],[82,12,1.1],[2,34,.6],[91,32,1.8],[10,52,2.2],[86,51,.4]].forEach(([x, y, d]) => { const b = document.createElement('span'); b.className = 'butterfly'; b.textContent = '🦋'; b.style.left = x + '%'; b.style.top = y + '%'; b.style.animationDelay = d + 's'; bq.appendChild(b); });
  updateHint();
}
function updateHint() { const hint = $('hint'); hint.classList.remove('gone'); hint.textContent = bloomedSet.size < FLOWERS.length ? `Đang nở hoa… ${bloomedSet.size}/${FLOWERS.length}` : CFG.hint; }
function bloomOne(k) { if (bloomedSet.has(k)) return; bloomedSet.add(k); photoEls[k].classList.add('on'); updateHint(); }
async function startAutoBloom(s) { await sleep(350); if (!alive(s)) return; $('cap').textContent = CFG.bouquetCaption; $('cap').classList.add('show'); for (let k = 0; k < FLOWERS.length; k++) { if (!alive(s)) return; bloomOne(k); await sleep(420); } }

let holdTimer = null;
function cancelHold() { clearTimeout(holdTimer); holdTimer = null; if (!finishing) $('bq').classList.remove('holding'); }
function setupHoldBouquet() {
  const bq = $('bq');
  bq.addEventListener('pointerdown', e => {
    if (finishing || !$('bouquet').classList.contains('on')) return; if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (bloomedSet.size < FLOWERS.length) { showToast('Chờ bó hoa nở hết nhé'); return; }
    e.preventDefault(); cancelHold(); bq.classList.add('holding');
    holdTimer = setTimeout(() => { holdTimer = null; if (finishing || bloomedSet.size < FLOWERS.length) return; finishing = true; finish(); }, CFG.holdMs);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => bq.addEventListener(t, cancelHold)); bq.addEventListener('contextmenu', e => e.preventDefault());
}

/* THAY THẾ TOÀN BỘ ĐOẠN NÀY ĐỂ THÀNH QUẢ CẦU 3D */
const Warp = (() => {
  const cv = $('warp'), ctx = cv.getContext('2d');
  const TAU = Math.PI * 2, ZMIN = .6, ZMAX = 2.4;
  let W = 0, H = 0, dpr = 1, RS = 2, R = 800, on = false, raf = 0, prev = 0, tm = 0, builtDiag = 0, builtW = 0;
  let tSpr = [], hSpr = [], pSpr = [], picImgs = [], bag = [], items = [], stars = [];
  
  // Các biến 3D sphere
  let angX = 0, angY = 0, velX = 0, velY = 0, zoom = 1, zoomT = 1, angXT = 0, angYT = 0, drag = false, snap = false;
  let px0 = 0, py0 = 0, lastT = 0, travel = 0, tapAt = 0, pinchD = 0, pinchA = 0;
  const ptrs = new Map();
  const clampZ = z => Math.max(ZMIN, Math.min(ZMAX, z));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  function fit() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    RS = Math.min(2, dpr * 1.25);
  }
  function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
  const loadImg = u => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = u; });
  function loadFonts() { if (!document.fonts) return Promise.resolve(); return document.fonts.load('700 40px "Dancing Script"', CFG.messages.join('')).catch(() => {}); }

  function textSprite(t, base, Wt) {
    const pad = 44, d = RS; const font = p => `700 ${p}px "Dancing Script","Be Vietnam Pro",cursive`;
    const m = mk(8, 8).getContext('2d'); let px = base; m.font = font(px); const meas = s => m.measureText(s).width;
    let lines = [t];
    if (meas(t) > Wt) { const words = t.split(' '); if (words.length > 1) { let best = null; for (let k = 1; k < words.length; k++) { const a = words.slice(0, k).join(' '), b = words.slice(k).join(' '), mw = Math.max(meas(a), meas(b)); if (!best || mw < best.mw) best = { mw, l: [a, b] }; } lines = best.l; } }
    let w = Math.max(...lines.map(meas));
    if (w > Wt) { px = Math.max(14, Math.floor(px * Wt / w)); m.font = font(px); w = Math.max(...lines.map(meas)); }
    const l1 = px * 1.25, vw = Math.ceil(w), vh = Math.ceil(l1 * lines.length); const lw = vw + pad * 2, lh = vh + pad * 2;
    const c = mk(Math.ceil(lw * d), Math.ceil(lh * d)), x = c.getContext('2d'); x.scale(d, d); x.font = font(px); x.textAlign = 'center'; x.textBaseline = 'middle';
    lines.forEach((ln, k) => { const cx = lw / 2, cy = pad + l1 * (k + .5); x.shadowColor = '#ff2e93'; x.fillStyle = '#ff5fae'; x.shadowBlur = 30 * d; x.fillText(ln, cx, cy); x.shadowBlur = 12 * d; x.fillText(ln, cx, cy); x.shadowBlur = 3 * d; x.fillStyle = '#ffe6f2'; x.fillText(ln, cx, cy); });
    c.lw = lw; c.lh = lh; c.vw = vw; c.vh = vh; return c;
  }
  function heartSprite(s, [c1, c2]) {
    const pad = 30, d = RS, vw = s * 1.1, vh = s * .92, lw = vw + pad * 2, lh = vh + pad * 2; const c = mk(Math.ceil(lw * d), Math.ceil(lh * d)), x = c.getContext('2d'); x.scale(d, d); const cx = lw / 2, cy = lh / 2 - s * .025;
    const g = x.createLinearGradient(0, cy - s * .45, 0, cy + s * .46); g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.shadowColor = '#ff2e93'; x.shadowBlur = 22 * d; x.fillStyle = g; x.beginPath(); x.moveTo(cx, cy + s * .46); x.bezierCurveTo(cx - s * .78, cy, cx - s * .62, cy - s * .78, cx, cy - s * .2); x.bezierCurveTo(cx + s * .62, cy - s * .78, cx + s * .78, cy, cx, cy + s * .46); x.fill();
    x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(cx - s * .27, cy - s * .22, s * .1, s * .06, -.7, 0, TAU); x.fill();
    c.lw = lw; c.lh = lh; c.vw = vw; c.vh = vh; return c;
  }
  function picSprite(im, w, h) {
    const pad = 28, d = RS, lw = w + pad * 2, lh = h + pad * 2; const c = mk(Math.ceil(lw * d), Math.ceil(lh * d)), x = c.getContext('2d'); x.scale(d, d);
    x.shadowColor = '#ff2e93'; x.shadowBlur = 24 * d; x.fillStyle = '#fff'; rr(x, pad, pad, w, h, 12); x.fill(); x.shadowBlur = 0; x.save(); rr(x, pad + 3, pad + 3, w - 6, h - 6, 9); x.clip();
    const r = Math.max((w - 6) / im.naturalWidth, (h - 6) / im.naturalHeight), iw = im.naturalWidth * r, ih = im.naturalHeight * r; x.drawImage(im, pad + w / 2 - iw / 2, pad + h / 2 - ih / 2, iw, ih); x.fillStyle = 'rgba(255,70,150,.16)'; x.fillRect(pad, pad, w, h); x.restore();
    c.lw = lw; c.lh = lh; c.vw = w; c.vh = h; return c;
  }
  function buildSprites() {
    const Wt = Math.max(130, Math.min(300, W * .42)); const base = Math.max(20, Math.min(W * .07, H * .06, 44)); tSpr = CFG.messages.map(t => textSprite(t, base, Wt));
    const hs = Math.max(34, Math.min(56, W * .1)); hSpr = [['#ffb3d1', '#ff2e7e'], ['#ff8a8a', '#d4163c']].map(c => heartSprite(hs, c));
    const pw = Math.max(84, Math.min(150, Wt * .62)); pSpr = picImgs.map(im => picSprite(im, pw, pw * 1.22)); bag = [];
  }
  function nextText() { if (!bag.length) { bag = tSpr.map((_, i) => i); for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; } } return tSpr[bag.pop()]; }

  // KHỞI TẠO QUẢ CẦU VÀ LAYER
  function buildWorld() {
    const diag = Math.hypot(W, H); R = diag / 2 / ZMIN + 60; builtDiag = diag; builtW = W;
    items = [];
    const nItems = Math.min(100, Math.max(45, Math.floor(W * H / 10000))); // Phân bổ số lượng tuỳ màn hình
    for (let i = 0; i < nItems; i++) {
      const r = Math.random();
      const kind = r < .6 ? 'text' : r < .85 ? 'heart' : (pSpr.length ? 'pic' : 'text');
      const spr = kind === 'text' ? nextText() : kind === 'heart' ? pick(hSpr) : pick(pSpr);
      const theta = Math.random() * TAU;
      const u = Math.random() * 2 - 1; // cho điểm phân bố đều trên mặt cầu
      const phi = Math.acos(u);
      const layer = Math.random(); // 0 to 1
      const radius = Math.min(W, H) * (0.45 + 0.55 * layer); // Tạo "nhiều mặt layer xếp trên nhau"
      items.push({ kind, spr, theta, phi, r: radius, baseSc: kind === 'text' ? rnd(.8, 1.15) : kind === 'heart' ? rnd(.6, 1) : rnd(.7, .95), ph: rnd(0, TAU), tilt: kind === 'pic' ? rnd(-.15, .15) : 0 });
    }
    const ns = Math.min(W, H) < 600 ? 45 : 70;
    stars = Array.from({ length: ns }, () => ({ x: rnd(0, W), y: rnd(0, H), r: Math.random() < .25 ? 2 : 1, a: rnd(.25, .8), p: rnd(0, TAU), tw: rnd(.8, 2.2), v: rnd(6, 18) }));
  }

  // CẬP NHẬT & RENDER 3D
  function frame(t) {
    if (!on) return; raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - prev) / 1000 || .016); prev = t; tm += dt;

    if (snap && !drag && !ptrs.size) { // Snap về thẳng đứng
      angX += (angXT - angX) * Math.min(1, dt * 7);
      angY += (angYT - angY) * Math.min(1, dt * 7);
      if (Math.abs(angXT - angX) < .002 && Math.abs(angYT - angY) < .002) { angX = angXT; angY = angYT; snap = false; }
    } else if (!drag && !ptrs.size) { // Quán tính & tự động xoay
      angX += velX * dt; velX *= Math.pow(.04, dt);
      angY += velY * dt; velY *= Math.pow(.04, dt);
      angY -= 0.15 * dt; // Tự động xoay chậm quanh trục Y giống quả địa cầu
    }
    zoom += (zoomT - zoom) * Math.min(1, dt * 10);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const s of stars) { s.y -= s.v * dt; if (s.y < -2) { s.y = H + 2; s.x = rnd(0, W); } s.p += dt * s.tw; ctx.globalAlpha = s.a * (.55 + .45 * Math.sin(s.p)); ctx.fillRect(s.x, s.y, s.r, s.r); }
    
    ctx.translate(W / 2, H / 2);
    const renderList = [];
    const fov = Math.max(W, H) * 1.3; // Trường nhìn góc rộng

    for (const it of items) {
      // 1. Toạ độ 3D ban đầu
      const x0 = it.r * Math.sin(it.phi) * Math.cos(it.theta);
      const y0 = it.r * Math.cos(it.phi);
      const z0 = it.r * Math.sin(it.phi) * Math.sin(it.theta);

      // 2. Xoay quanh trục X
      const x1 = x0;
      const y1 = y0 * Math.cos(angX) - z0 * Math.sin(angX);
      const z1 = y0 * Math.sin(angX) + z0 * Math.cos(angX);

      // 3. Xoay quanh trục Y
      const x2 = x1 * Math.cos(angY) + z1 * Math.sin(angY);
      const y2 = y1;
      const z2 = -x1 * Math.sin(angY) + z1 * Math.cos(angY);

      // 4. Phối cảnh (Perspective projection)
      const projZ = fov + z2;
      if (projZ <= 0) continue; // Phía sau camera
      const sc = (fov / projZ) * zoom;
      renderList.push({ it, px: x2 * sc, py: y2 * sc, z: z2, sc });
    }

    // 5. Z-Sorting: sắp xếp từ xa đến gần
    renderList.sort((a, b) => b.z - a.z);

    const maxR = Math.min(W, H) * 1.2;
    for (const curr of renderList) {
      const { it, px, py, z, sc } = curr;
      let fsc = sc * it.baseSc; let rot = it.tilt;
      if (it.kind === 'heart') { fsc *= 1 + .07 * Math.sin(tm * 2.6 + it.ph); rot += Math.sin(tm * 1.1 + it.ph) * .1; }
      else if (it.kind === 'pic') { rot += Math.sin(tm * .9 + it.ph) * .05; }
      const w = it.spr.lw * fsc, h = it.spr.lh * fsc;
      
      // Mặt sau thì mờ dần
      let alpha = 1 - (z + maxR) / (2 * maxR);
      ctx.globalAlpha = Math.max(0.08, Math.min(1, alpha + 0.35));

      if (rot) { ctx.save(); ctx.translate(px, py); ctx.rotate(rot); ctx.drawImage(it.spr, -w / 2, -h / 2, w, h); ctx.restore(); }
      else ctx.drawImage(it.spr, px - w / 2, py - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
  }

  const pt = e => [e.clientX - W / 2, e.clientY - H / 2];
  function reset() { zoomT = 1; angXT = 0; angYT = Math.round(angY / TAU) * TAU; snap = true; velX = velY = 0; }
  function down(e) {
    if (!on) return; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);

    } else if (ptrs.size === 2) {
      drag = false; velX = velY = 0; snap = false; tapAt = 0;
      const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a[0] - b[0], a[1] - b[1]); pinchA = Math.atan2(b[1] - a[1], b[0] - a[0]);
    }
  }
  function move(e) {
    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size >= 2) { // Thu phóng + Vặn

    const [x, y] = pt(e), dx = x - px0, dy = y - py0; travel += Math.abs(dx) + Math.abs(dy);
    const dts = Math.max(.008, (e.timeStamp - lastT) / 1000);
    velY = Math.max(-8, Math.min(8, velY * .5 + (dx / dts) * .003));

  }

    else if (ptrs.size === 1) { const [x, y] = [...ptrs.values()][0]; drag = true; velX = velY = 0; travel = 99; px0 = x - W / 2; py0 = y - H / 2; lastT = e.timeStamp; }
  }

  return {
    bind() {
      cv.style.touchAction = 'none';
      cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
      cv.addEventListener('wheel', e => { e.preventDefault(); zoomT = clampZ(zoomT * Math.exp(-e.deltaY * .0015)); }, { passive: false });

    },
    async start(urls) {
      fit(); ptrs.clear(); let loaded = false; const fontsP = loadFonts().then(() => { loaded = true; }); const imgsP = Promise.all(urls.map(loadImg));
      await Promise.race([fontsP, sleep(2500)]); const late = !loaded; picImgs = (await imgsP).filter(Boolean);
      buildSprites(); buildWorld(); angX = angY = velX = velY = 0; zoom = zoomT = 1; snap = false; drag = false; tm = 0; on = true; prev = performance.now();
      if (late) fontsP.then(() => { if (on) { buildSprites(); buildWorld(); } }); raf = requestAnimationFrame(frame);
    },

  };
})();
/* KẾT THÚC PHẦN THAY THẾ */

function stopFloat() { Warp.stop(); skyPaused = false; }
async function finish() {
  const s = session; $('hint').classList.add('gone'); $('cap').classList.remove('show'); $('bq').classList.remove('holding'); $('bq').classList.add('leaving');
  await sleep(650); if (!alive(s)) return;
  show('float'); skyPaused = true; const bay = (await flyP).filter(Boolean); await Warp.start(bay); // quả cầu chỉ dùng ảnh bay, không lấy ảnh bông hoa
  if (!alive(s)) { stopFloat(); return; }
  const h = $('fhint'); h.textContent = 'Vuốt để xoay · Chụm để phóng to · Chạm đúp để đặt lại'; h.style.opacity = .85; setTimeout(() => { h.style.opacity = 0; }, 6500);
  await sleep(CFG.btnDelay); if (!alive(s)) return; $('openBtn').classList.add('show');
}

let opened = false, userScroll = false;
// Bấm nút trên màn chữ xoay thì thư mới hiện ra, không tự mở
async function openLetter() {
  if (opened) return; opened = true; const s = session;
  $('openBtn').classList.remove('show'); $('fhint').style.opacity = 0;
  const u = await firstOf(CFG.letterPhoto ? [CFG.letterPhoto] : ['thu.jpg', 'thu.jpeg', 'thu.png', 'thu.webp'], 300); // ảnh trong thư: file tên thu
  if (!alive(s)) return;
  if (u) { $('lPhoto').style.backgroundImage = `url('${u}')`; $('lPhoto').classList.add('has'); }
  stopFloat();
  $('letter').classList.add('on');
  playLetter(s);
}
async function playLetter(s) {
  const sc = $('lScroll'); userScroll = false; sc.scrollTop = 0; $('lTitle').textContent = ''; $('lBody').innerHTML = ''; $('lSign').textContent = '';
  const f = setInterval(() => { if (!userScroll) sc.scrollTop = sc.scrollHeight; }, 150); timers.push(f);
  await type($('lTitle'), CFG.letterTitle, 60, s);
  for (const line of CFG.letter) { if (!alive(s)) break; const p = document.createElement('p'); $('lBody').appendChild(p); await type(p, line, 28, s); }
  if (alive(s)) await type($('lSign'), CFG.sign, 90, s); clearInterval(f);
}

function initNightSky() {
  const canvas = $('nightSky'), ctx = canvas.getContext('2d', { alpha: false }); let w = 0, h = 0, stars = [], raf = 0, last = 0, resizeT = 0;
  function resize() { w = innerWidth; h = innerHeight; canvas.width = w; canvas.height = h; const count = Math.min(70, Math.max(35, Math.round(w * h / 12000))); stars = Array.from({ length: count }, () => ({ x: Math.random() * w | 0, y: Math.random() * h | 0, r: Math.random() < .25 ? 2 : 1, a: Math.random() * .65 + .2, p: Math.random() * 6.28, v: Math.random() * .05 + .015 })); last = 0; }
  function draw(t) { raf = requestAnimationFrame(draw); if (skyPaused || t - last < 40) return; last = t; ctx.globalAlpha = 1; ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#fff'; for (const s of stars) { s.p += s.v; ctx.globalAlpha = s.a * (.62 + .38 * Math.sin(s.p)); ctx.fillRect(s.x, s.y, s.r, s.r); } }
  resize(); raf = requestAnimationFrame(draw);
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 200); }, { passive: true });
  document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(draw); });
}

function startShow() { if (started || !$('intro').classList.contains('on') || Date.now() < introReadyAt) return; started = true; BGM.start(CFG.music); session++; finishing = false; $('cap').classList.remove('show'); $('cap').textContent = ''; buildBouquet(); show('bouquet'); startAutoBloom(session); }
function init() {
  initNightSky(); $('bqImg').src = CFG.bouquetImage; $('introTitle').textContent = CFG.intro.title; $('introSub').textContent = CFG.intro.sub; $('tapHint').textContent = CFG.intro.button; $('openBtn').textContent = CFG.openLabel;
  setupHoldBouquet(); Warp.bind();
  $('intro').addEventListener('pointerdown', startShow);
  $('openBtn').addEventListener('click', openLetter);
  $('lScroll').addEventListener('touchmove', () => { userScroll = true; }, { passive: true });
  $('replay').onclick = () => { session++; timers.forEach(clearInterval); timers = []; stopFloat(); finishing = false; started = false; opened = false; introReadyAt = Date.now() + 700; $('letter').classList.remove('on'); $('openBtn').classList.remove('show'); $('cap').classList.remove('show'); show('intro'); };
}
init();

// Nhạc nền: phát nhac.mp3 nếu có, không thì tự tạo giai điệu nhẹ bằng Web Audio
const BGM = (() => {
  const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
  const MEL = [4,5,6,5, 4,3,2,-1, 2,3,4,3, 2,1,0,-1, 4,5,6,7, 6,5,4,-1, 3,4,5,-1, 4,3,2,1];
  const CH = [0, 0, 3, 3, 4, 4, 0, 0];
  const STEP = 0.42, LEAD = 0.6;
  let on = false, muted = false, audio = null, ctx = null, out = null, timer = null, nextT = 0, idx = 0;

  function tone(f, t, d, v, type = 'sine') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + d + 0.05);
  }

  function schedule() {
    while (nextT < ctx.currentTime + LEAD) {
      const r = CH[Math.floor(idx / 4) % CH.length];
      if (idx % 4 === 0) {
        [r, r + 2, r + 4].forEach(k => tone(SCALE[k], nextT, STEP * 4, 0.04));
        tone(SCALE[r] / 2, nextT, STEP * 4, 0.08, 'triangle');
      }
      const m = MEL[idx % MEL.length];
      if (m >= 0) tone(SCALE[m], nextT, STEP * 1.8, 0.12);
      nextT += STEP; idx++;
    }
  }

  function startGen() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      out = ctx.createGain();
      out.gain.value = 0;
      out.connect(ctx.destination);
    }
    ctx.resume();
    nextT = ctx.currentTime + 0.1; idx = 0;
    out.gain.cancelScheduledValues(ctx.currentTime);
    out.gain.linearRampToValueAtTime(muted ? 0 : 0.22, ctx.currentTime + 2);
    clearInterval(timer);
    schedule();
    timer = setInterval(schedule, 120);
  }

  function start(file) {
    if (on) return;
    on = true;
    $('musicBtn').classList.add('show');
    if (file) {
      const a = new Audio(file);
      a.loop = true; a.volume = 0; a.preload = 'auto';
      a.play().then(() => {
        audio = a;
        a.muted = muted;
        let v = 0;
        const fade = setInterval(() => { v = Math.min(0.35, v + 0.02); a.volume = v; if (v >= 0.35) clearInterval(fade); }, 100);
      }).catch(() => startGen());
      a.addEventListener('error', () => { if (!audio) startGen(); });
      return;
    }
    startGen();
  }

  function toggle() {
    muted = !muted;
    if (audio) audio.muted = muted;
    if (ctx && out) out.gain.linearRampToValueAtTime(muted ? 0 : 0.22, ctx.currentTime + 0.4);
    $('musicBtn').classList.toggle('off', muted);
  }

  document.addEventListener('visibilitychange', () => {
    if (!on) return;
    if (document.hidden) { if (audio) audio.pause(); if (ctx) ctx.suspend(); }
    else { if (audio && !muted) audio.play().catch(() => {}); if (ctx) ctx.resume(); }
  });

  return { start, toggle };
})();

document.addEventListener('DOMContentLoaded', () => $('musicBtn').addEventListener('click', BGM.toggle));
</script>
